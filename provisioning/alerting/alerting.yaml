apiVersion: 1

contactPoints:
  - orgId: 1
    name: "Kentik Alerts Email"
    receivers:
      - uid: "kentik-email"
        type: email
        settings:
          addresses: "cboyd@kentik.com"
          singleEmail: true

policies:
  - orgId: 1
    receiver: "Kentik Alerts Email"
    group_by: ['grafana_folder', 'alertname']
    group_wait: "30s"
    group_interval: "5m"
    repeat_interval: "4h"
