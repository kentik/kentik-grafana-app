services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      # SMTP for alert email delivery (uses Grafana's built-in SMTP)
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587"
      GF_SMTP_USER: ""
      GF_SMTP_FROM_ADDRESS: "grafana-alerts@kentik.com"
      GF_SMTP_FROM_NAME: "Kentik Grafana Alerts"
      GF_SMTP_SKIP_VERIFY: "true"
      # Unified alerting
      GF_UNIFIED_ALERTING_ENABLED: "true"

volumes:
  grafana-storage:
